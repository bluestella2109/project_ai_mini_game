<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PROJECT AI // SYSTEM CONTROL</title>
    <link rel="stylesheet" href="style.css">
    <!-- Firebase SDK (CDN) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div id="app">
    <!-- 1. 初期選択画面 -->
    <section id="screen-entry" class="screen active">
        <div class="header-ui">SYSTEM READY // ACCESS POINT</div>
        <h1 class="glitch-text">PROJECT AI</h1>
        <p class="sub-text">侵入を開始するには下のボタンをタップしてください</p>
        <div class="start-circle-outer" onclick="app.initPlayer()">
            <div class="start-circle-inner">
                <div class="power-icon"></div>
                <span>MISSION START</span>
            </div>
        </div>
        <button class="admin-link" onclick="app.showAdminLogin()">ADMINISTRATOR LOGIN</button>
    </section>

    <!-- 2. ゲームコンテナ -->
    <section id="screen-game" class="screen">
        <div class="game-hud">
            <div class="hud-left">MISSION: <span id="mission-num">01</span></div>
            <div class="hud-center" id="mission-title">SYSTEM REBOOT</div>
            <div class="hud-right">ID: <span id="display-id">--</span></div>
        </div>
        <div id="game-canvas-area">
            <!-- ここにJSでゲーム内容が描画される -->
        </div>
    </section>

    <!-- 3. AI侵略アラート画面 -->
    <section id="screen-alert" class="screen">
        <div class="alert-overlay"></div>
        <div class="alert-content">
            <h2 class="alert-title">CRITICAL ERROR</h2>
            <div class="alert-msg">
                <p>AIシステムの暴走を確認。物理層への干渉が開始されました。</p>
                <p class="highlight">この端末の制御は既に奪われています。</p>
                <p>至急、教室内にある「メインサーバー」を物理的にシャットダウンし、AIの拡散を阻止してください！</p>
            </div>
            <button class="reset-btn" onclick="location.reload()">TERMINAL REBOOT</button>
        </div>
    </section>

    <!-- 4. 管理者画面 -->
    <section id="screen-admin" class="screen">
        <div class="admin-header">
            <h2>REALTIME NODE MONITOR</h2>
            <button onclick="location.reload()">LOGOUT</button>
        </div>
        <div id="admin-device-list" class="admin-grid">
            <!-- デバイス状況がカードで並ぶ -->
        </div>
    </section>
</div>

<script src="script.js"></script>
</body>
</html>
